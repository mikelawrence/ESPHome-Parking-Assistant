substitutions:
  name: "parking-assistant"
  friendly_name: "Parking Assistant"
  company_name: "Mike Lawrence"
  # To enable floor mode (sensor pointed at the floor) set door_distance to '0'
  #   When position > ${floor_distance} + ${tolerance} the space is considered empty
  #   To leave the empty state, ${floor_distance} + ${tolerance} > position > ${floor_trigger}
  #     If position bypasses this range, most likely it is a person walking in front of the sensor
  # If door_distance is not zero then sensor is pointing at a garage door
  hysterysis: "2.5"             # amount of position change to prevent bouncing between states in (cm)
  tolerance: "10"               # +/- tolerance in (cm) for changing states
  door_distance: "0"            # distance (cm) to garage door
  floor_distance: "345.5"       # distance (cm) to garage floor, should be close to the average value
  floor_trigger: "275"          # measurements in this range will trigger state machine, must be greater than floor_distance - tolerance
  park_distance: "104.0"        # max distance (cm) where car is considered parked (closest to the garage door)
  park_tolerance: "10.0"        # +/- tolerance (cm) around park_distance still considered parked

esphome:
  name: ${name}
  friendly_name: ${friendly_name} 
  name_add_mac_suffix: false
  project:
    name: Mike Lawrence.${friendly_name}
    version: 0.2.0
  on_boot:
    then:
      - light.turn_on:
          id: led_strip
          brightness: 100%
          effect: "Parking Bar"

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://mikelawrence/esphome-component-tfmini@2026.8.0
  - source: github://mikelawrence/esphome-component-stusb4500@2026.8.0

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true

bluetooth_proxy:
  active: true

# Disable logging, this will greatly reduce glitching on the light bar
logger:
  level: DEBUG
  logs:
    tfmini.sensor: ERROR

debug:
  update_interval: 60s

# Enable Home Assistant API
api:
  encryption:
    key: mpFBP+apdcrB3yCqG6ieFTunwUGe31kPHWxF9l2Ncsk=

# Enable Over-the-Air updates
ota:
  id: my_ota
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  # Garage Door Closed = 0, Garage Door Open = 10, Car Parking Zone = 20, Car Parked = 30, Car Over = 40
  - id: state
    type: int
  - id: last_state
    type: int
  - id: distance
    type: float

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time: 
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: "id(pcb_power).reset_energy_counters();"

# config the UART for the TFMini sensor
uart:
  - id: tfmini_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz

power_supply:
  - id: 'power_supply_5V'
    pin: GPIO38
    enable_on_boot: true
    enable_time: 1s

stusb4500:
    id: pd_controller
    alert_pin: GPIO8
    # flash_nvm: true
    # # Use this section for 5V LEDs.
    # i_snk_pdo1: 3.00A
    # snk_pdo_numb: 1
    # # End 5V LED section
    # Use this section for 12V LEDs
    snk_pdo_numb: 2
    i_snk_pdo1: 3.00A
    v_snk_pdo2: 9.00V
    i_snk_pdo2: 3.00A
    v_snk_pdo3: 12.00V
    i_snk_pdo3: 3.00A
    # End 12V LED section
    req_src_current: true
    # power_only_above_5v: true
    gpio_cfg: SW_CTRL_GPIO
    usb_comms_capable: true

button:
  - platform: restart
    name: "Restart"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      disabled_by_default: true

  - platform: stusb4500
    pd_status:
      name: PD Status

  - platform: template
    name: "State"
    id: state_machine
    update_interval: 1s
    lambda: |-
      static uint8_t last_state = 255;
      // all states
      //if (id(state) != last_state) {
      //  last_state = id(state);
      //  switch (id(state)) {
      //  case 0: // (door closed) state
      //    return { "Idle" };
      //  case 10: // (empty) state
      //    return { "Empty" };
      //  case 11: // (empty) state
      //    return { "Triggered" };
      //  case 20: // (door closed) state
      //    return { "Door Closed" };
      //  case 30: // (door open) state
      //    return { "Door Open Init" };
      //  case 31: // (door opened) state
      //    return { "Door Opened" };
      //  case 40: // (parking init) state
      //    return { "Parking Init" };
      //  case 41: // (parking) state, LEDs active
      //    return { "Parking" };
      //  case 42: // (parking timeout) state
      //    return { "Parking LED Off" };
      //  case 50: // (parked init) state
      //    return { "Parked Init" };
      //  case 51: // (parked early)
      //    return { "Parked Early" };
      //  case 52: // (parked late)
      //    return { "Parked Late" };
      //  case 53: // (parked timeout) state
      //    return { "Parked LED Off" };
      //  case 60: // (too far init) state
      //    return { "Too Far Init" };
      //  case 61: // (too far) state
      //    return { "Too Far" };
      //  case 62: // (too far timeout) state
      //    return { "Too Far LED Off" };
      //  default:
      //    return {};
      //  }
      //} else {
      //  return {};
      //}
      // simplified states
      if (id(state) != last_state) {
        last_state = id(state);
        switch (id(state)) {
        case 0: // (door closed) state
          return { "Idle" };
        case 10: // (empty) state
        case 11: // (triggered) state
          return { "Empty" };
        case 20: // (door closed) state
          return { "Door Closed" };
        case 30: // (door open init) state
        case 31: // (door opened) state
          return { "Door Open" };
        case 40: // (parking init) state
        case 41: // (parking) state, LEDs active
        case 42: // (parking timeout) state
          return { "Parking/Leaving" };
        case 50: // (parked init) state
        case 51: // (parked early)
        case 52: // (parked late)
        case 53: // (parked timeout) state
          return { "Parked" };
        case 60: // (too far init) state
        case 61: // (too far) state
        case 62: // (too far timeout) state
          return { "Too Far" };
        default:
          return {};
        }
      } else {
        return {};
      }

binary_sensor:
  # this is a sensor on the garage door that turns true when open
  - platform: homeassistant
    name: "Car Garage Door Sensor"
    id: ha_garage_door_open
    entity_id: binary_sensor.car_garage_door_sensor
  - platform: template
    name: "Car in Garage"
    device_class: presence
    lambda: "return (id(state) >= 40);"
  - platform: template
    name: "Car Parked Correctly"
    lambda: "return ((id(state) >= 50) && (id(state) < 60));"
  - platform: template
    name: "Car Parked too Far"
    lambda: "return ((id(state) >= 60) && (id(state) < 70));"
  - platform: gpio
    id: power_good_5v
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
  - platform: gpio
    id: overload_5v
    pin:
      number: GPIO16
      inverted: true
      mode:
        input: true
        pullup: true

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
  - platform: ina2xx_i2c
    id: pcb_power
    model: INA228
    address: 0x40
    shunt_resistance: 0.050ohm
    max_current: 3A
    adc_range: 0
    update_interval: 60s
    bus_voltage:
      name: "Voltage"
      accuracy_decimals: 2
    power:
      name: "Power"
      accuracy_decimals: 2
    energy:
      name: "Energy"
      accuracy_decimals: 2
    # energy_joules:
    #   name: "Energy Joules"
    #   accuracy_decimals: 2

  - platform: tfmini
    uart_id: tfmini_uart
    model: TFMINI_S
    sample_rate: 200
    distance:
      id: tfmini_distance
      # internal: true
      name: "TFMini Distance"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 30
            send_every: 10
        # - throttle_average : 0.5s
        - lambda: |-
            int current_locked = id(distance);
            
            // If the smoothed value rises 1cm ABOVE the next whole step, snap up
            if (x > (current_locked + 1.0)) {
              id(distance) = std::round(x);
            }
            // If the smoothed value drops 1cm BELOW the previous whole step, snap down
            else if (x < (current_locked - 1.0)) {
              id(distance) = std::round(x);
            }
            
            // Return the locked integer, completely eliminating micro-bounces
            return id(distance);
        - or:
          - delta: 1.0
          - heartbeat: 60s
    signal_strength:
      id: tfmini_signal_strength
      name: "TFMini Signal Strength"
      # internal: true
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 30
            send_every: 10
        - throttle_average : 0.5s
        - or:
          - delta: 3
          - heartbeat: 60s

light:
  - platform: esp32_rmt_led_strip
    id: led_status
    name: "Led Status"
    internal: true
    channel_colors: GRB
    pin: GPIO6
    num_leds: 1
    chipset: ws2812
    rmt_symbols: 48
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 500ms
          update_interval: 700ms
          max_brightness: 0.4
      - pulse:
          name: "Flash"
          transition_length: 200ms
          update_interval: 200ms

  - platform: esp32_rmt_led_strip
    id: led_strip
    default_transition_length : 0s
    channel_colors: GRB
    pin: GPIO47
    num_leds: 141
    chipset: ws2812
    use_psram: false
    rmt_symbols: 288
    effects:
      - addressable_lambda:
          name: "Parking Bar"
          update_interval: 20ms
          lambda: |-
            static const char TAG[] = "Parking_Bar_Effect";
            static uint64_t timeout;
            static uint32_t tick = 0;
            static int16_t scan = 0;
            static float bin = -1000.0;
            static float bin_tolerance; 
            static int16_t start_distance = ${door_distance} == 0 ? ${floor_distance} - ${tolerance} : ${door_distance} - ${tolerance};
            static uint8_t half_size;
            static float stopped_pos;
            static int16_t last_pos_bin;
            static uint8_t forward;
            int16_t pos_bin;
            float pos;

            pos = id(distance);
            if (pos == 0.0) {
              // ESP_LOGI(TAG, "Invalid sensor reading");
              return; // invalid sensor reading, we need to ignore
            }
            // process intial run
            if (bin == -1000.0) {
              ESP_LOGD(TAG, "Effect Started");
              bin = (start_distance - (${park_distance} + ${park_tolerance})) / ((it.size() / 2.0));
              bin_tolerance = bin;
              //if (bin_tolerance < 1.25)
              //  bin_tolerance = 1.25;
              half_size = (it.size() / 2.0) + 0.5;
              id(state) = 0;
              id(last_state) = 0;
              forward = true;
            }
            // add hysteresis to pos_bin based on current direction
            if (forward) {
              pos_bin = (start_distance - pos + bin_tolerance) / bin + 0.5;
            } else {
              pos_bin = (start_distance - pos - bin_tolerance) / bin + 0.5;
            }
            // update direction
            if(forward) {
              if (last_pos_bin > pos_bin) {
                forward = false;
              }
            } else {
              if (last_pos_bin < pos_bin) {
                forward = true;
              }
            }
            // process state machine
            switch (id(state)) {
              // Init = 0, Empty = 10, Door Closed = 20, Door Open = 30, Parking = 40, Parked = 50, Too Far = 60
            case 0: // (init) state
              if (${door_distance} == 0) {
                // distance sensor is pointed at the ground
                if (pos <= ${park_distance} - ${park_tolerance}) {
                  // car is too far, goto (too far init) state
                  id(state) = 60;
                } else if (pos <= ${park_distance} + ${park_tolerance}) {
                  // car is parked, goto (parked init) state
                  id(state) = 50;
                } else if (pos <= start_distance) {
                  // car is parking, goto (parking init) state
                  id(state) = 40;
                } else {
                  // car is not in space
                  it.all().set(Color::BLACK);
                  ESP_LOGD(TAG, "Entered empty state");
                  id(state) = 10;
                }
              } else {
                // distance sensor is pointed at a garage door
                if (pos <= ${park_distance} - ${park_tolerance}) {
                  // car is too far, goto (too far init) state
                  id(state) = 60;
                } else if (pos <= ${park_distance} + ${park_tolerance}) {
                  // car is parked, goto (parked init) state
                  id(state) = 50;
                } else if (pos <= start_distance) {
                  // car is parking, goto (parking init) state
                  id(state) = 40;
                } else if (pos <= ${door_distance} + ${tolerance}) {
                  // car is no-man's land, between door open distance and start_distance
                  if (id(last_state) >= 40) {
                    // car was backing out
                    it.all().set(Color::BLACK);
                    ESP_LOGD(TAG, "Entered Door Open state");
                    id(state) = 30; // car is still moving, goto (door open) state
                  } else {
                    // car is not in motion, no way to know what is happening
                    it.all().set(Color::BLACK);
                    ESP_LOGD(TAG, "Entered Door Closed state");
                    id(state) = 20; // probably a restart, goto (door closed) state
                  }
                } else {
                  // door is open
                  it.all().set(Color::BLACK);
                  ESP_LOGD(TAG, "Entered door open state");
                  id(state) = 30; // door is open, goto (door open) state
                }
              }
              break;
            case 10: // (empty) state, $door_distance must be set to 0 for this state to occur
              // bay is empty
              if ((pos <= start_distance) && (pos > ${floor_trigger})) {
                ESP_LOGD(TAG, "Entered Triggered state");
                id(state) = 11; // car entered trigger zone, goto (triggered) state
              }
              break;
            case 11: // (triggered) state, $door_distance must be set to 0 for this state to occur
              if (millis() - timeout > 250) {
                if ((pos <= start_distance) && (pos > ${floor_trigger})) {
                  // we stayed in the triggered space for long enough
                  id(state) = 40; // looks like car entered parking zone, goto (parking init) state
                } else {
                  // we didn't stay in the triggered space long enough, go back to empty
                  ESP_LOGD(TAG, "Entered Empty state");
                  id(state) = 10; // goto (empty state)
                }
              }
              break;
            case 20: // (door closed) state, $door_distance must be > 0 for this state to occur
              // bay empty when in this state
              if (pos > ${door_distance} + ${tolerance}) {
                // looks like the door opened
                ESP_LOGD(TAG, "Entered door opened state");
                id(state) = 31; // goto (door opened) state
              }
              break;
            case 30: // (door open) state, $door_distance must be > 0 for this state to occur
              // garage door is open, look for car moving in or door to close
              if (pos <= start_distance) {
                id(state) = 40; // car entered parking zone, goto (parking init) state
              } else if ((abs(pos - ${door_distance}) <=  ${tolerance}) && 
                         (millis() - timeout > 60000)) {
                // by adding a timeout here we give car a chance to pull in and 
                // hit the start_distance before registering as a door close
                ESP_LOGD(TAG, "Entered Door Closed state");
                id(state) = 20;
              }
              break;
            case 31: // (door opened) state, $door_distance must be > 0 for this state to occur
              // garage door just opened, a car may be trying to park
              if (millis() - timeout > 60000) {
                // no change in position for 60 seconds
                if (pos > ${door_distance} + ${tolerance}) {
                  // looks like the door is still open
                  id(state) = 30; // goto (door init) state
                } else if (pos <= ${door_distance} - ${tolerance}) {
                  // looks like door is closed
                  ESP_LOGD(TAG, "Entered Door Closed state");
                  id(state) = 20; // goto (door closed) state
                }
              } else {
                if (pos <= start_distance) {
                  // looks like car entered parking zone
                  id(state) = 40; // goto (parking init) state
                }
              }
              break;
            case 40: // (parking init) state, any parking state can be entering or leaving
              id(state) = 41; // pass through this state to the (parking) state
              ESP_LOGD(TAG, "Entered Parking state");
              if (!forward)
                scan = pos_bin;
              else
                scan = 0;
              break;
            case 41: // (parking) state, LEDs active
              if (millis() - timeout > 60000) {
                // no change in position for 60 seconds, turn off display
                it.all().set(Color::BLACK);
                stopped_pos = pos;
                ESP_LOGD(TAG, "Timeout, no motion for 60s while in parking state.");
                id(state) = 42; // goto to the (parking timeout) state
              } else {
                if (forward) {
                  if (scan >= pos_bin)
                    scan = 0;
                  else
                    scan++;
                } else {
                  if ((scan == 0) || (scan > pos_bin))
                    scan = pos_bin;
                  else
                    scan--;
                }
                for (int16_t i = 0; i < half_size; i++)
                {
                  if ((i < pos_bin) && (i > pos_bin - 3)) {
                    // bright pixels on inner edge of bars
                    it[i].set(Color(0, 0, 255));
                    it[it.size() - i - 1].set(Color(0, 0, 255));
                  } else if ((i < pos_bin) && (i == scan)) {
                    // bright pixels moving inside bars indicating direction
                    it[i].set(Color(0, 0, 255));
                    it[it.size() - i - 1].set(Color(0, 0, 255));  //
                  } else if (i < pos_bin) {
                    // dim pixels comprising the rest of the bar
                    it[i].set(Color(0, 0, 128));
                    it[it.size() - i - 1].set(Color(0, 0, 128));
                  } else {
                    // all other pixels are off
                    it[i].set(Color::BLACK);
                    it[it.size() - i - 1].set(Color::BLACK);
                  }
                }
                if (pos < ${park_distance} - ${park_tolerance}) {
                  id(state) = 60; // car moved too far, goto (too far) state
                } else if (pos <= ${park_distance} + ${park_tolerance}) {
                  id(state) = 50; // car moved into beginning of parked zone, goto (parked init) state
                } else if (pos <= start_distance) {
                  id(state) = 41; // stay in this (parking) state
                } else {
                  // use Init State to figure out next state
                  id(state) = 0; // goto (init state)
                }
              }
              break;
            case 42: // (parking timeout) state
              if (pos > stopped_pos + 2*${park_tolerance}) {
                // looks like we started moving out
                id(state) = 40; // position changed, goto (parking init) state
                ESP_LOGD(TAG, "Position Changed in timeout");
              }
              break;
            case 50: // (parked init) state
              if (pos <= ${park_distance}) {
                // turn LEDs on full brightness green color, back half of Parked region
                it.all().set(Color(0, 255, 0));
                id(state) = 52; // goto (parked late) state
                ESP_LOGD(TAG, "Entered Parked Late state");
              } else {
                // turn LEDs on full brightness yellow color, front half of Parked region
                it.all().set(Color(255, 255, 0));
                id(state) = 51; // goto to (parked early) state
                ESP_LOGD(TAG, "Entered Parked Early state");
              }
              break;
            case 51: // (parked early)
              if (millis() - timeout > 10000) {
                // no change in position for 10 seconds, turn off display and goto (parked timeout) state
                stopped_pos = pos;
                it.all().set(Color::BLACK);
                ESP_LOGD(TAG, "Timeout, no motion for 10s while in parked state.");
                id(state) = 53; // goto (parked timeout) state
              } else {
                // produce twinkle effect
                for (uint8_t i = 0; i < it.size(); i++) {
                  uint8_t level = it[i].get().g;
                  if (level >= 130 && level <= 126)
                    level = 128;
                  if (level > 128)
                    level -= 2;
                  else
                    level += 2;
                  it[i].set(Color(level, level, 0));
                }
                while (random_float() < 0.5) {
                  uint16_t position = random_uint32() % it.size();
                  it[position].set(Color(255, 255, 0));
                }
                if (pos <= ${park_distance} - ${park_tolerance}) {
                  id(state) = 60; // car moved too far, goto (too far init) state
                } else if (pos <= ${park_distance}) {
                  // back half of Parked region, turn LEDs on full brightness green color
                  it.all().set(Color(0, 255, 0));
                  id(state) = 52; // goto (parked late) state
                } else if (pos <= ${park_distance} + ${park_tolerance}) {
                  id(state) = 51; // stay in (parked early) state
                } else if (pos <= start_distance) {
                  id(state) = 40; // car moved into parking zone, goto (parking init) state
                } else {
                  // use Init State to figure out next state
                  id(state) = 0; // goto (init state)
                }
              }
              break;
            case 52: // (parked late)
              if (millis() - timeout > 10000) {
                // no change in position for 10 seconds, turn off display and goto (parked timeout) state
                stopped_pos = pos;
                it.all().set(Color::BLACK);
                ESP_LOGD(TAG, "Timeout, no motion for 10s while in parked state.");
                id(state) = 53; // goto (parked timeout) state
              } else {
                // produce twinkle effect
                for (uint8_t i = 0; i < it.size(); i++) {
                  uint8_t level = it[i].get().g;
                  if (level >= 130 && level <= 126)
                    level = 128;
                  if (level > 128)
                    level -= 2;
                  else
                    level += 2;
                  it[i].set(Color(0, level, 0));
                }
                while (random_float() < 0.5) {
                  uint16_t position = random_uint32() % it.size();
                  it[position].set(Color(0, 255, 0));
                }
                if (pos <= ${park_distance} - ${park_tolerance}) {
                  id(state) = 60; // car moved too far, goto (too far init) state
                } else if (pos <= ${park_distance} + ${hysterysis}) {
                  id(state) = 52; // stay in (parked late) state
                } else if (pos <= ${park_distance} + ${park_tolerance}) {
                  // front half of Parked region, turn LEDs on full brightness green color
                  it.all().set(Color(0, 255, 0));
                  id(state) = 51; // goto (parked early) state
                } else if (pos <= start_distance) {
                  id(state) = 40; // car moved into parking zone, goto (parking init) state
                } else {
                  // use Init State to figure out next state
                  id(state) = 0; // goto (init state)
                }
              }
              break;
            case 53: // (parked timeout) state
              if (pos > stopped_pos + 2*${park_tolerance}) {
                // car appears to be moving out
                id(state) = 40; // position changed enough to move out of (parked) state, goto (parking init) state
                ESP_LOGD(TAG, "Position Changed and moving out");
              }
              break;
            case 60: // (too far init) state
              // turn LEDs on full brightness red color
              it.all().set(Color(255, 0, 0));
              id(state) = 61; // continue to actual (too far) state
              ESP_LOGD(TAG, "Entered Too Far state (%f)", pos);
              break;
            case 61: // (too far) state
              if (millis() - timeout > 60000) {
                // no change in position for 60 seconds, turn off display and goto (too far timeout) state
                it.all().set(Color::BLACK);
                stopped_pos = pos;
                scan = 0;
                ESP_LOGD(TAG, "Timeout, no motion for 60s while in Too Far state.");
                id(state) = 62; // goto (too far timeout) state
              } else {
                for (uint8_t i = 0 ; i < (it.size() + 1) / 2; i++) {
                  uint8_t red = (sin((scan + i)*M_PI/8 + M_PI/2) + 1.0) / 2.0 * 255;
                  it[i].set(Color(red, 0, 0));
                  it[it.size() - 1 - i].set(Color(red, 0, 0));
                }
                scan++;
                if (pos <= ${park_distance} - ${park_tolerance}) {
                  id(state) = 61; // no change, stay in (too far state) state
                } else if (pos <= ${park_distance} + ${hysterysis}) {
                  id(state) = 50; // car moved into parked zone, goto (parked init) state
                } else if (pos <= start_distance) {
                  id(state) = 40; // car moved into parking zone, goto (parking init) state
                } else {
                  // use Init State to figure out next state
                  id(state) = 0; // goto (init state)
                }
              }
              break;
            case 62: // (too far timeout) state
              if (pos > stopped_pos + 2*${park_tolerance}) {
                // car appears to be moving out
                id(state) = 40; // position changed enough, goto (parking init) state
                ESP_LOGD(TAG, "Position changed and moving out");
              }
              break;
            default:
              id(state) = 0;
              break;
            }
            // if there is a state change then reset timeout
            if (id(last_state) != id(state))
              timeout = millis();
            last_pos_bin = pos_bin;
            id(last_state) = id(state);
